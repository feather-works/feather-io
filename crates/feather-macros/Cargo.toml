[package]
name = "feather-macros"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Motor de macros JavaScript reutilizável entre os aplicativos da suíte FeatherWorks"

[dependencies]
boa_engine = { version = "0.22", default-features = false }
boa_gc = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
falcao-runtime = { git = "https://github.com/feather-works/falcao", tag = "v0.1.1", optional = true }

[features]
# Roda as macros no Falcão em vez do Boa (experimento, 27/10/2026).
falcao = ["dep:falcao-runtime"]
